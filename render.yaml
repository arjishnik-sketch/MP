# ==============================================================================
# Render Blueprint Specification for Panchavati Daily Duty Chart
# Full-Stack Orchestration: PostgreSQL 17 + Fastify REST API + Next.js UI
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Fastify Backend API
  # ----------------------------------------------------------------------------
  - type: web
    name: daily-duty-panchavati-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev
    startCommand: npm run render:start
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: info
      - key: TZ
        value: Asia/Kolkata
      - key: PGSSLMODE
        value: require
      - key: PANCHAVATI_KEEP_EXISTING
        value: "1"
      - key: CORS_ORIGIN
        value: "*"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=512"
      # Auto-connect to PostgreSQL Database
      - key: DATABASE_URL
        fromDatabase:
          name: panchavati-demo-db
          property: connectionString
      - key: PGHOST
        fromDatabase:
          name: panchavati-demo-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: panchavati-demo-db
          property: port
      - key: PGUSER
        fromDatabase:
          name: panchavati-demo-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: panchavati-demo-db
          property: password
      - key: PGDATABASE
        fromDatabase:
          name: panchavati-demo-db
          property: database

  # ----------------------------------------------------------------------------
  # 2. Next.js Frontend Web Client
  # ----------------------------------------------------------------------------
  - type: web
    name: daily-duty-panchavati-ui
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: commit
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TZ
        value: Asia/Kolkata
      - key: NODE_OPTIONS
        value: "--max-old-space-size=512"
      # Auto-connect to Backend Fastify API
      - key: FASTIFY_URL
        fromService:
          type: web
          name: daily-duty-panchavati-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: daily-duty-panchavati-api
          envVarKey: RENDER_EXTERNAL_URL

# ------------------------------------------------------------------------------
# 3. Managed PostgreSQL Database
# ------------------------------------------------------------------------------
databases:
  - name: panchavati-demo-db
    plan: free
    region: oregon
    databaseName: panchavati3_dev
    databaseUser: panchavati
    postgresMajorVersion: "17"
    ipAllowList: []
