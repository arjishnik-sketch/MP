# Render Blueprint for Panchavati Daily Duty Chart (Fastify API, Next.js UI & PostgreSQL).
#
# Deploying this blueprint sets up:
# 1. Managed PostgreSQL database (panchavati-demo-db)
# 2. Fastify backend API web service (daily-duty-panchavati-api)
# 3. Next.js frontend web service (daily-duty-panchavati-ui)
#
# The Next.js frontend automatically connects to the Fastify API via FASTIFY_URL.

services:
  # Fastify REST API Backend
  - type: web
    name: daily-duty-panchavati-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev
    startCommand: npm run db:migrate && npm run db:seed && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: PGSSLMODE
        value: require
      - key: PANCHAVATI_KEEP_EXISTING
        value: "1"
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: panchavati-demo-db
          property: connectionString

  # Next.js Frontend UI
  - type: web
    name: daily-duty-panchavati-ui
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FASTIFY_URL
        fromService:
          type: web
          name: daily-duty-panchavati-api
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: panchavati-demo-db
    plan: free
    region: oregon
    postgresMajorVersion: "17"
