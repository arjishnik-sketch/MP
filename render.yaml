# Render Blueprint for the Fastify API and its PostgreSQL database.
#
# The Next frontend is a separate process in the local handoff. Deploy it separately and set its
# FASTIFY_URL to this API's public origin, or run both processes on a host with a process supervisor.
# The demo seed contains the approved station 10/09 chart. Keep this deployment private/approved when
# using real station data.
services:
  - type: web
    name: daily-duty-panchavati
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev
    startCommand: npm run db:migrate && npm run db:seed && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: PGSSLMODE
        value: require
      - key: PANCHAVATI_KEEP_EXISTING
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: panchavati-demo-db
          property: connectionString

databases:
  - name: panchavati-demo-db
    plan: free
    postgresMajorVersion: "17"
